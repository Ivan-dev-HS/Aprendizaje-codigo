name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://codeforge:codeforge_ci_password@localhost:5432/codeforge?schema=public
  JWT_ACCESS_SECRET: ci_only_access_secret_not_for_prod_use
  JWT_REFRESH_SECRET: ci_only_refresh_secret_not_for_prod_use
  EXEC_SERVICE_INTERNAL_TOKEN: ci_only_internal_token_not_for_prod_use
  NODE_ENV: test

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge_ci_password
          POSTGRES_DB: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed database (los tests de integración de /labs usan el SQL Lab sembrado)
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Start exec-service (usado por los tests de integración de /labs)
        run: |
          pnpm --filter @codeforge/exec-service run start &
          npx wait-on http://localhost:4100/health -t 30000
        env:
          SANDBOX_DATABASE_URL: postgresql://codeforge_sandbox:codeforge_sandbox_password@localhost:5432/codeforge?schema=sandbox

      - name: Unit & integration tests
        run: pnpm test
        env:
          EXEC_SERVICE_URL: http://localhost:4100

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge_ci_password
          POSTGRES_DB: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API and exec-service
        run: |
          pnpm --filter @codeforge/exec-service run start &
          pnpm --filter @codeforge/api run start &
          npx wait-on http://localhost:4000/api/v1/health -t 30000
        env:
          EXEC_SERVICE_URL: http://localhost:4100

      - name: Build and preview web
        run: |
          pnpm --filter @codeforge/web run build
          pnpm --filter @codeforge/web exec vite preview --port 5173 &
          npx wait-on http://localhost:5173 -t 30000

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
